version: '3.8'

services:
  gateway:
    build:
      context: ../
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - ../config:/root/config
      - ../keys:/root/keys
    depends_on:
      - redis
      - mysql
    networks:
      - gateway-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - gateway-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: platform_gateway
    ports:
      - "3306:3306"
    networks:
      - gateway-network

networks:
  gateway-network:
    driver: bridge
